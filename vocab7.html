<style>

  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font-family:'Rubik',system-ui,sans-serif; }
  .wrap { max-width:980px; margin:0 auto; padding:28px 16px 48px; }
  header { text-align:center; margin-bottom:24px; }
  .brand { display:inline-flex; align-items:center; gap:8px; font-weight:600; color:var(--purple); letter-spacing:.02em; font-size:14px; }
  .dot { width:10px; height:10px; background:var(--yellow); transform:rotate(45deg); border-radius:2px; }
  h1 { margin:10px 0 4px; font-size:clamp(24px,5vw,34px); font-weight:700; }
  .sub { color:var(--muted); font-size:15px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:18px; box-shadow:0 6px 24px rgba(91,31,168,.07); }
  /* locked */
  #locked { max-width:560px; margin:0 auto; padding:34px 22px; text-align:center; }
  .lock { width:64px; height:64px; margin:0 auto 14px; border-radius:50%; background:var(--soft); display:grid; place-items:center; }
  .lock svg { width:30px; height:30px; }
  .opens { font-size:18px; font-weight:600; margin:4px 0 22px; }
  .count { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; max-width:420px; margin:0 auto 22px; }
  .unit { background:var(--soft); border-radius:12px; padding:12px 4px; }
  .num { font-size:clamp(24px,7vw,32px); font-weight:700; color:var(--purple); font-variant-numeric:tabular-nums; }
  .lbl { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-top:2px; }
  .langs { color:var(--muted); font-size:14px; line-height:1.6; }
  /* answers */
  #answers { display:none; }
  .parts { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  @media (max-width:760px){ .parts { grid-template-columns:1fr; } }
  .part { padding:16px 14px 8px; }
  .part h2 { margin:0 0 4px; text-align:center; font-size:18px; color:var(--purple); }
  .quick { text-align:center; color:var(--muted); font-size:13px; margin-bottom:10px; line-height:1.7; }
  .quick b { color:var(--ink); font-weight:600; }
  .row { display:grid; grid-template-columns:28px 1fr 40px; align-items:center; gap:10px; padding:10px 4px; border-top:1px solid var(--line); }
  .n { color:var(--muted); font-size:14px; text-align:right; font-variant-numeric:tabular-nums; }
  .w { font-weight:600; font-size:16px; }
  .m { font-size:13.5px; color:#4A4458; margin-top:2px; line-height:1.4; }
  .t { font-size:12.5px; color:var(--muted); margin-top:2px; }
  .l { justify-self:center; width:36px; height:36px; border-radius:10px; background:var(--purple); color:#fff; display:grid; place-items:center; font-weight:700; font-size:16px; }
  footer { text-align:center; color:var(--muted); font-size:13px; margin-top:26px; }
</style>
</head>

  function pad(n){ return (n < 10 ? '0' : '') + n; }
  function decode(b64){
    var bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return JSON.parse(new TextDecoder('utf-8').decode(bytes));
  }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function show(){
    var parts = decode(DATA), html = '';
    parts.forEach(function(items, k){
      var quick = items.map(function(i){ return i.n + '&nbsp;<b>' + i.l + '</b>'; }).join(' · ');
      html += '<div class="card part"><h2>Part ' + (k + 1) + '</h2><div class="quick">' + quick + '</div>';
      items.forEach(function(i){
        html += '<div class="row"><div class="n">' + i.n + '.</div><div><div class="w">' + esc(i.w) + '</div><div class="m">' + esc(i.m) +
                '</div><div class="t">' + esc(i.t) + '</div></div><div class="l">' + i.l + '</div></div>';
      });
      html += '</div>';
    });
    document.getElementById('parts').innerHTML = html;
    document.getElementById('locked').style.display = 'none';
    document.getElementById('answers').style.display = 'block';
  }
  function tick(){
    var left = UNLOCK - Date.now();
    if (left <= 0) { show(); return; }
    var s = Math.floor(left / 1000);
    document.getElementById('dd').textContent = Math.floor(s / 86400);
    document.getElementById('hh').textContent = pad(Math.floor(s % 86400 / 3600));
    document.getElementById('mm').textContent = pad(Math.floor(s % 3600 / 60));
    document.getElementById('ss').textContent = pad(s % 60);
    setTimeout(tick, 1000);
  }
  tick();
</script>

</html>
